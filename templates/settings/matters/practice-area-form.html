{% load i18n %}
<div class="modal-dialog modal-sm">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">
        {% if practice_area %}
          {% trans "Edit Practice Area" %}
        {% else %}
          {% trans "Add Practice Area" %}
        {% endif %}
      </h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')" aria-label="{% trans 'Close' %}">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="practice-area-form"
            hx-post="{{ request.path }}"
            hx-target="#htmx-modal-container"
            role="form"
            class="form-compact">
        {% csrf_token %}
        {{ form }}
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">{% trans "Cancel" %}</button>
      <button type="submit" form="practice-area-form" class="btn btn-success">{% trans "Submit" %}</button>
    </div>
  </div>
</div>
